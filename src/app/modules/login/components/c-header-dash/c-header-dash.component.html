<p-menubar [model]="items()">
  <ng-template pTemplate="start">
    <div class="flex items-center">
      @if(themeDark()){
      <img src="logo-espoch.svg" class="h-8 mr-2" />
      }@else{
      <img src="logo-espoch1.svg" class="h-8 mr-2" />
      }

      <div class="flex items-center">
        <div class="titulo">
          <p class="font-bold">ESPOCH PASS</p>
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="end">
    <div class="mr-3">
      @defer () {
      <p-dropdown
        opción="Roles"
        [(ngModel)]="rolSeleccionado"
        (onChange)="onChangeRol($event)"
        optionLabel="strNombre"
        [options]="lstRoles()"
        [appendTo]="'body'"
        [emptyMessage]="'No tiene roles asignados'"
      ></p-dropdown>
      }@placeholder(minimum 250ms) {
      <p-skeleton height="2rem" width="160px" styleClass="mb-2" />
      }
    </div>
  </ng-template>
</p-menubar>
<app-c-linea-rol [color]="idRolSeleccionado()" />
